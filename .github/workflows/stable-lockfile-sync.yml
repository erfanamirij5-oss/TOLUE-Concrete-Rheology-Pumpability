name: Stable v1.0.0 Lockfile Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stable-lockfile-sync.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository == 'erfanamirij5-oss/TOLUE-Concrete-Rheology-Pumpability'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Require stable package target
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.0.0"
      - name: Synchronize lockfile metadata only
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json "$RUNNER_TEMP/package-lock.before.json"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/package-lock.before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.version !== '1.0.0') throw new Error('package.json is not 1.0.0');
          if (after.version !== '1.0.0' || after.packages?.['']?.version !== '1.0.0') throw new Error('lockfile root metadata did not synchronize to 1.0.0');
          const scrub = x => { const y = structuredClone(x); delete y.version; if (y.packages?.['']) delete y.packages[''].version; return y; };
          if (JSON.stringify(scrub(before)) !== JSON.stringify(scrub(after))) throw new Error('Refusing sync: npm changed dependency-tree data beyond root version metadata');
          NODE
          test "$(git diff --name-only)" = "package-lock.json"
      - name: Create deterministic sync branch and PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='automation/v1.0.0-lockfile-sync'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add package-lock.json
          git commit -m 'chore(release): sync v1.0.0 lockfile metadata'
          git push --force-with-lease origin "$branch"
          gh pr create --base main --head "$branch" --title 'Release: synchronize v1.0.0 lockfile metadata' --body 'Automated bounded sync: updates only package-lock root version metadata from the accepted package.json 1.0.0 target. The workflow fails closed if npm changes dependency-tree data.'
