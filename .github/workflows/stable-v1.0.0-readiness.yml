name: Stable v1.0.0 Readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-readiness:
    name: Verify stable release prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Engineering regression suite
        run: npm test

      - name: Stable trust validator regression suite
        run: node --test scripts/validate-stable-license-trust.node-test.mjs

      - name: Verify provisioned stable trust material
        shell: bash
        run: |
          set -euo pipefail
          RING='release/stable/v1.0.0/tolue-license-public-keyring.json'
          PEM='release/stable/v1.0.0/tolue-license-public-key.pem'
          if [ -f "$RING" ] || [ -f "$PEM" ]; then
            test -f "$RING" && test -f "$PEM" || { echo 'STABLE-GATE-101: stable PEM and keyring must be provisioned together'; exit 1; }
            node scripts/validate-stable-license-trust.mjs "$RING" "$PEM"
          else
            echo 'Stable public trust material not provisioned yet; publication remains blocked by S1.'
          fi

      - name: Assert no production private key is committed
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='BEGIN ([A-Z0-9]+ )*PRIVATE KEY'
          if git grep -n -I -E -- "$PATTERN" -- ':!package-lock.json'; then
            echo 'STABLE-GATE-106: private-key material detected in tracked source'
            exit 1
          fi

      - name: Verify stable publication remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/STABLE_RELEASE_HARDENING_v1.0.0.md
          if [ -f .github/workflows/release-stable-v1.0.0.yml ]; then
            grep -q 'Authenticode' .github/workflows/release-stable-v1.0.0.yml || { echo 'STABLE-GATE-107: stable workflow lacks Authenticode gate'; exit 1; }
            grep -q 'release/stable/v1.0.0' .github/workflows/release-stable-v1.0.0.yml || { echo 'STABLE-GATE-108: stable workflow does not require stable trust material'; exit 1; }
          else
            echo 'Stable publication workflow not present yet; publication remains blocked by S4.'
          fi
