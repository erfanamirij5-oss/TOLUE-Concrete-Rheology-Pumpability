name: Stable v1.0.0 Readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-readiness:
    name: Verify stable release prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Engineering regression suite
        run: npm test

      - name: Stable trust validator regression suite
        run: node --test scripts/validate-stable-license-trust.node-test.mjs

      - name: Stable public trust provisioning regression suite
        run: node --test scripts/prepare-stable-license-trust.node-test.mjs

      - name: Verify provisioned stable trust material
        shell: bash
        run: |
          set -euo pipefail
          RING='release/stable/v1.0.0/tolue-license-public-keyring.json'
          PEM='release/stable/v1.0.0/tolue-license-public-key.pem'
          if [ -f "$RING" ] || [ -f "$PEM" ]; then
            test -f "$RING" && test -f "$PEM" || { echo 'STABLE-GATE-101: stable PEM and keyring must be provisioned together'; exit 1; }
            node scripts/validate-stable-license-trust.mjs "$RING" "$PEM"
          else
            echo 'Stable public trust material not provisioned yet; publication remains blocked by S1.'
          fi

      - name: Assert no production private key is committed
        shell: bash
        run: |
          set -euo pipefail
          PATTERN='BEGIN ([A-Z0-9]+ )*PRIVATE KEY'
          if git grep -n -I -E -- "$PATTERN" -- ':!package-lock.json'; then
            echo 'STABLE-GATE-106: private-key material detected in tracked source'
            exit 1
          fi

      - name: Verify stable publication workflow policy
        shell: bash
        run: |
          set -euo pipefail
          WF='.github/workflows/release-stable-v1.0.0.yml'
          ACCEPT='.github/workflows/stable-licensed-restart-acceptance.yml'
          test -f docs/STABLE_RELEASE_HARDENING_v1.0.0.md
          test -f scripts/prepare-stable-license-trust.mjs || { echo 'STABLE-GATE-124: stable public trust provisioning tool missing'; exit 1; }
          test -f "$WF" || { echo 'STABLE-GATE-107: stable publication workflow missing'; exit 1; }
          test -f "$ACCEPT" || { echo 'STABLE-GATE-116: licensed restart acceptance workflow missing'; exit 1; }
          grep -q 'workflow_dispatch:' "$WF" || { echo 'STABLE-GATE-108: stable publication must be explicit/manual'; exit 1; }
          grep -q 'release/stable/v1.0.0' "$WF" || { echo 'STABLE-GATE-109: stable workflow does not require stable trust material'; exit 1; }
          grep -q 'WIN_CSC_LINK' "$WF" || { echo 'STABLE-GATE-110: Authenticode certificate gate missing'; exit 1; }
          grep -q 'WIN_CSC_KEY_PASSWORD' "$WF" || { echo 'STABLE-GATE-111: Authenticode credential gate missing'; exit 1; }
          grep -q 'EXPECTED_AUTHENTICODE_PUBLISHER' "$WF" || { echo 'STABLE-GATE-112: expected publisher verification missing'; exit 1; }
          grep -q 'Get-AuthenticodeSignature' "$WF" || { echo 'STABLE-GATE-113: post-build Authenticode verification missing'; exit 1; }
          grep -q 'TimeStamperCertificate' "$WF" || { echo 'STABLE-GATE-114: timestamp verification missing'; exit 1; }
          grep -q 'build/icons/tolue.ico' "$WF" || { echo 'STABLE-GATE-115: owner-approved icon gate missing'; exit 1; }
          grep -q 'Stable Licensed Restart Acceptance' "$WF" || { echo 'STABLE-GATE-119: release workflow must require exact-SHA licensed restart acceptance run'; exit 1; }
          grep -q 'candidate_sha:' "$ACCEPT" || { echo 'STABLE-GATE-120: acceptance workflow must bind evidence to an exact candidate SHA'; exit 1; }
          grep -q 'evidence_sha256:' "$ACCEPT" || { echo 'STABLE-GATE-121: acceptance workflow must bind an immutable evidence digest'; exit 1; }
          grep -q 'ACCEPT-v1.0.0' "$ACCEPT" || { echo 'STABLE-GATE-122: acceptance workflow explicit confirmation contract missing'; exit 1; }
          grep -q 'RELEASE_VERSION: 1.0.0' "$WF" || { echo 'STABLE-GATE-117: immutable stable version missing'; exit 1; }
          if grep -q 'LICENSED_RESTART_VERIFIED.txt' "$WF" "$ACCEPT"; then
            echo 'STABLE-GATE-123: self-referential tracked SHA evidence file is forbidden'
            exit 1
          fi
          if [ -f .github/workflows/release-rc-v0.9.0-rc.1.yml ]; then
            echo 'STABLE-GATE-118: completed one-shot RC workflow must be retired before stable transition'
            exit 1
          fi

      - name: Report external stable blockers without weakening PR readiness
        shell: bash
        run: |
          set -euo pipefail
          blockers=0
          [ -f release/stable/v1.0.0/tolue-license-public-keyring.json ] && [ -f release/stable/v1.0.0/tolue-license-public-key.pem ] || { echo 'BLOCKED S1: production public licensing trust material not provisioned'; blockers=$((blockers+1)); }
          [ -f build/icons/tolue.ico ] || { echo 'BLOCKED S3: owner-approved final TOLUE .ico not provisioned'; blockers=$((blockers+1)); }
          echo 'BLOCKED S5 until a successful Stable Licensed Restart Acceptance workflow run exists for the exact final publication SHA.'
          blockers=$((blockers+1))
          echo "Stable external blocker count: $blockers"
          echo 'S2 Authenticode certificate/publisher secrets are intentionally checked only inside the manual stable publication workflow.'
