name: Engineering Core CI

on:
  push:
    branches:
      - main
      - stage-0-scientific-reference-matrix
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  engineering-core:
    name: Typecheck and Golden Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Verify committed lockfile exists
        run: test -s package-lock.json

      - name: Install dependencies from committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Run engineering golden tests
        run: npm test

      - name: Build desktop boundaries
        run: npm run build:desktop
