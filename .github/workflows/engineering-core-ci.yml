name: Engineering Core CI

on:
  push:
    branches:
      - main
      - stage-0-scientific-reference-matrix
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  engineering-core:
    name: Bootstrap Lockfile and Verify Engineering Core
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          package-manager-cache: false

      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify generated lockfile
        run: test -s package-lock.json

      - name: Install dependencies from generated lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Run engineering golden tests
        run: npm test

      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
